<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farmer Dashboard - AgroMart</title>

<link rel="stylesheet" href="style.css">

</head>


<body onload="checkLogin('farmer')">


<header class="navbar">

<div class="logo">
🌱 AgroMart Farmer
</div>


<nav>

<a href="index.html">
Customer View
</a>

<button onclick="logoutUser()">
Logout
</button>

</nav>

</header>


<h1 style="text-align:center;margin:40px;">
Farmer Dashboard
</h1>
<section class="add-product">

<h2>
Add New Product
</h2>
<form id="productForm">

<input 
id="name" 
placeholder="Product Name"
autocomplete="off">


<input 
id="price" 
placeholder="Price"
autocomplete="off">



<select id="category">

<option value="">
Select Category
</option>


<option value="Rice">
🌾 Rice
</option>


<option value="Vegetable">
🥦 Vegetable
</option>


<option value="Fruit">
🍎 Fruit
</option>


<option value="Fish">
🐟 Fish
</option>


<option value="Dairy">
🥛 Dairy
</option>


<option value="Organic">
🌱 Organic
</option>

</select>



<input 
id="location"
placeholder="Location"
autocomplete="off">


<input 
id="farmer"
placeholder="Farmer Name"
autocomplete="off">


<input 
id="quantity"
placeholder="Quantity"
autocomplete="off">


<textarea
id="description"
placeholder="Product Description">
</textarea>



<div class="button-area">

<button type="button" onclick="addProduct()">
Add Product
</button>

</form>
</section>
<section class="products-section">
<h2>
My Added Products
</h2>
<div id="farmerProducts" class="products">
</div>
</section>
<script src="script.js"></script>
</body>

</html>
