<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - AgroMart</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="navbar">

<div class="logo">
🌱 AgroMart
</div>

</header>

<section class="register-page">

<div class="register-box">

<h2>Create Account 🌱</h2>

<p class="register-subtitle">
Join AgroMart as a customer or farmer
</p>


<form>

<input
id="username"
type="text"
placeholder="Full Name"
autocomplete="off">


<input
id="email"
type="email"
placeholder="Email Address"
autocomplete="off">


<input
id="password"
type="password"
placeholder="Password">


<select id="role">

<option value="">
Select Account Type
</option>

<option value="customer">
🛒 Customer
</option>

<option value="farmer">
👨‍🌾 Farmer
</option>

</select>


<button
type="button"
class="register-btn"
onclick="registerUser()">

Create Account

</button>

</form>


<p class="login-text">
Already have an account?
<a href="login.html">Login Here</a>
</p>

</div>

</section>

<script src="script.js"></script>


</body>

</html>
